<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive BPMN Blueprint Showcase</title>
  
  <!-- Core Layout Stylesheets from official unpkg mirrors -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com" />
  
  <!-- Unified stable production engine distribution script -->
  <script src="https://unpkg.com"></script>
  
  <style>
    html, body, #canvas {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background-color: #FAFAFA;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div id="canvas"></div>

  <script>
    // Exact match of your filename string inside the GitHub folder
    const bpmnFileUrl = './upwork_proposal_engine_1.bpmn';

    // Instantiating the global rendering system engine
    const viewer = new BpmnJS({ 
      container: document.getElementById('canvas') 
    });

    // Request logic block
    fetch(bpmnFileUrl)
      .then(res => {
        if (!res.ok) {
          throw new Error('Could not find the target file matching path name layout string');
        }
        return res.text();
      })
      .then(xmlString => {
        return viewer.importXML(xmlString);
      })
      .then(() => {
        // Adjust the camera grid layout coordinates to fit cleanly into your viewport window box
        viewer.get('canvas').zoom('fit-viewport');
      })
      .catch(err => {
        console.error('BPMN critical execution pipeline error log:', err);
      });
  </script>
</body>
</html>
